# Configuração do Cloudflare Workers (deploy pela internet).
# Rodar no seu computador não precisa nada disso — veja o README.

name = "horas-complementares"
main = "worker.js"
compatibility_date = "2026-01-01"

# Os arquivos de public/ são servidos pela própria Cloudflare.
[assets]
directory = "./public"
binding = "ASSETS"

[vars]
# Custo do PBKDF2 nas senhas. 10000 cabe no limite de 10ms de CPU do plano
# gratuito; no plano pago dá para subir para 100000 sem quebrar contas antigas
# (cada hash guarda o número de iterações com que foi criado).
ITERACOES_SENHA = "10000"

[[d1_databases]]
binding = "DB"
database_name = "horas-complementares"
# Id do banco criado com `npm run banco:criar`. Não é segredo: o acesso depende
# da sua conta Cloudflare, não deste número.
database_id = "1e87d4af-135f-4f36-b5b6-ca1fe5c28ecd"
